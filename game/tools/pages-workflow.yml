# Builds the game and publishes it to GitHub Pages on every push to dev or main.
# The page is game/dist/local.html (with its own copy of Phaser, so it needs no CDN).
# Progress lives in each player's browser (localStorage), so updates never wipe it.
name: Publish the game
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
        working-directory: game
      - run: npm run build
        working-directory: game
      - name: Gather the site
        run: |
          mkdir -p site
          cp game/dist/local.html site/index.html
          cp game/dist/phaser.min.js site/phaser.min.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
